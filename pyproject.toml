[project]
name = "cfgs"
version = "0.14.0"
description = "🍇 XDG standard config files 🍇"
authors = [{ name = "Tom Ritchford", email = "tom@swirly.com" }]
requires-python = ">=3.10"
readme = "README.rst"
license = "MIT"
classifiers = ["Programming Language :: Python :: 3", "Programming Language :: Python :: 3.10", "Programming Language :: Python :: 3.11", "Programming Language :: Python :: 3.12", "Programming Language :: Python :: 3.13", "Programming Language :: Python :: 3.14"]

[dependency-groups]
dev = [
    "coverage>=7.1.0,<8",
    "flake8==5.0.4",
    "import-all>=0.9.5,<0.10",
    "pyfakefs>=5.1.0,<6",
    "pytest>=7.2.1,<8",
    "pyupgrade>=3.21.2",
    "pyyaml>=6.0,<7",
    "ruff>=0.14.14",
    "ty>=0.0.14",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.coverage.run]
branch = true
include = "cfgs.py"

[tool.coverage.report]
fail_under = "63"
skip_covered = true
exclude_lines = ["pragma: no cover", "if False:", "if __name__ == .__main__.:", "raise NotImplementedError"]


[tool.ruff.format]
quote-style = "single"
